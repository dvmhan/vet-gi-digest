name: diag
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/diag.py
        env:
          PYTHONPATH: src
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
